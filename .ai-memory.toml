# ai-memory project scope configuration.
# Static MCP clients (no session-id bridge) must pass workspace+project
# explicitly on every project-scoped call. This file declares the canonical
# names so agents and the server resolve this repository's scope
# deterministically instead of falling back to the shared "default" slot.
workspace = "Code"
project = "dandgabr.github.io"
project_strategy = "repo-root"
